<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="earthGradient" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </radialGradient>
    <filter id="earthGlow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Earth -->
  <circle cx="200" cy="200" r="180" fill="url(#earthGradient)" filter="url(#earthGlow)"/>
  
  <!-- Continents (simplified) -->
  <path d="M 80 120 Q 120 100 160 120 Q 180 140 160 160 Q 140 180 120 160 Q 100 140 80 120" fill="#2d5a27" opacity="0.7"/>
  <path d="M 200 80 Q 240 60 280 80 Q 300 100 280 120 Q 260 140 240 120 Q 220 100 200 80" fill="#2d5a27" opacity="0.7"/>
  <path d="M 120 200 Q 160 180 200 200 Q 240 220 280 200 Q 300 240 280 280 Q 260 300 240 280 Q 220 260 200 280 Q 180 300 160 280 Q 140 260 120 240 Q 100 220 120 200" fill="#2d5a27" opacity="0.7"/>
  
  <!-- Atmosphere -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.3"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.2"/>
</svg>

