<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="satelliteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Satellite body -->
  <ellipse cx="50" cy="50" rx="25" ry="15" fill="url(#satelliteGradient)" filter="url(#glow)"/>
  
  <!-- Solar panels -->
  <rect x="20" y="45" width="15" height="10" fill="#00d4ff" opacity="0.8"/>
  <rect x="65" y="45" width="15" height="10" fill="#00d4ff" opacity="0.8"/>
  
  <!-- Antenna -->
  <line x1="50" y1="35" x2="50" y2="20" stroke="#00d4ff" stroke-width="2"/>
  <circle cx="50" cy="20" r="3" fill="#00d4ff"/>
  
  <!-- Details -->
  <circle cx="45" cy="50" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="55" cy="50" r="2" fill="#ffffff" opacity="0.6"/>
</svg>

